---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-production
  labels:
    project: chaos-engineering

---
# Ollama deployment (commented parameters are for GPU usage)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: chaos-production
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: chaos-ollama-model:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_CTX
              value: "2048"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1" # Never unload mode
            - name: OLLAMA_NUM_PARALLEL
              value: "0"
            # - name: HSA_OVERRIDE_GFX_VERSION
            #   value: "10.3.0"
          # securityContext:
          #   privileged: true
          resources:
            limits:
              memory: "6Gi"
              cpu: "8"
              ephemeral-storage: "2Gi"
            requests:
              memory: "3Gi"
              cpu: "2"
              ephemeral-storage: "500Mi"
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            timeoutSeconds: 20
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 40
            periodSeconds: 5
            timeoutSeconds: 5
          # volumeMounts:
          #   - mountPath: /dev/kfd
          #     name: dev-kfd
          #   - mountPath: /dev/dri
          #     name: dev-dri
      # volumes:
      #   - name: dev-kfd
      #     hostPath:
      #       path: /dev/kfd
      #   - name: dev-dri
      #     hostPath:
      #       path: /dev/dri
---
# Service, internal access
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: chaos-production
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
  type: ClusterIP

---
# Service, external access
apiVersion: v1
kind: Service
metadata:
  name: ollama-ext
  namespace: chaos-production
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      nodePort: 30434
  type: NodePort
