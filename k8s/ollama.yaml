---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-production
  labels:
    project: chaos-engineering

---
# Ollama deployment (CPU only)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: chaos-production
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: chaos-ollama-model:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_KEEP_ALIVE
              value: "-1" # Never unload models
          resources:
            limits:
              memory: "5Gi"
              cpu: "4"
              ephemeral-storage: "2Gi"
            requests:
              memory: "2Gi"
              cpu: "1"
              ephemeral-storage: "500Mi"
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            timeoutSeconds: 20
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 40
            periodSeconds: 5
---
# Service, internal access
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: chaos-production
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
  type: ClusterIP

---
# Service, external access
apiVersion: v1
kind: Service
metadata:
  name: ollama-ext
  namespace: chaos-production
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      nodePort: 30434
  type: NodePort
