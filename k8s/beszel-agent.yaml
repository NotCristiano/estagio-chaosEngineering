apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beszel-agent
  namespace: default # Change if you want it in the beszel namespace
spec:
  selector:
    matchLabels:
      app: beszel-agent
  template:
    metadata:
      labels:
        app: beszel-agent
    spec:
      hostNetwork: true # Required to monitor host network stats and bind the port
      containers:
        - name: beszel-agent
          image: henrygd/beszel-agent:latest
          env:
            - name: PORT
              value: "45876"
            - name: KEY
              value: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIHAB+jIDtSeGgvK8SIVoaboe8QHuSxz91ETabM3RCC0"
          volumeMounts:
            - name: container-sock
              # Change to /run/containerd/containerd.sock if your k8s uses containerd
              mountPath: /var/run/docker.sock
              readOnly: true
      volumes:
        - name: container-sock
          hostPath:
            path: /var/run/docker.sock