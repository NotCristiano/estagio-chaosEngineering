apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beszel-agent
  namespace: default
spec:
  selector:
    matchLabels:
      app: beszel-agent
  template:
    metadata:
      labels:
        app: beszel-agent
    spec:
      hostNetwork: true
      containers:
        - name: beszel-agent
          image: henrygd/beszel-agent:latest
          env:
            - name: PORT
              value: "45876"
            - name: KEY
            # This value will be different from computer to computer
              value: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIHAB+jIDtSeGgvK8SIVoaboe8QHuSxz91ETabM3RCC0"
          volumeMounts:
            - name: container-sock
              mountPath: /var/run/docker.sock
              readOnly: true
      volumes:
        - name: container-sock
          hostPath:
            path: /var/run/docker.sock
