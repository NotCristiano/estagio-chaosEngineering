apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  arc-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 3,
          "title": "Accuracy 20 probes",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "poker_quality_accuracy{container=\"poker\"}",
              "legendFormat": "Accuracy Percent",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "fillOpacity": 25
              }
            }
          },
          "gridPos": {
            "h": 12,
            "w": 20,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 1,
          "title": "ARC-Challenge answered correctly 5m",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "increase(poker_quality_correct_total{container=\"poker\"}[5m])",
              "legendFormat": "__auto",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 12,
            "w": 4,
            "x": 20,
            "y": 0
          }
        },
        {
          "id": 4,
          "title": "Request Latency",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(poker_ask_duration_seconds_bucket{container=\"poker\"}[5m])) by (le))",
              "legendFormat": "P95",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum(rate(poker_ask_duration_seconds_bucket{container=\"poker\"}[5m])) by (le))",
              "legendFormat": "P50",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              }
            }
          },
          "gridPos": {
            "h": 12,
            "w": 20,
            "x": 0,
            "y": 12
          }
        },
        {
          "id": 2,
          "title": "ARC-Challenge answered wrong 5m",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "increase(poker_quality_wrong_total{container=\"poker\"}[5m])",
              "legendFormat": "__auto",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 12,
            "w": 4,
            "x": 20,
            "y": 12
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["CUSTOM"],
      "time": {
        "from": "now-5m",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"]
      },
      "timezone": "browser",
      "title": "ARC-Challenge",
      "uid": "88bc5d23-1a78-4382-a4e5-3bf881de4774",
      "version": 7
    }