---
apiVersion: batch/v1
kind: Job
metadata:
  name: chaos-poker
  namespace: chaos-production
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: poker
        image: chaos-ollama-poker:latest # build with: docker build -t chaos-ollama-poker:latest .
        imagePullPolicy: IfNotPresent
        args:
          - --target=http://ollama:11434
          - --model=llama3.2
          - --count=20
          - --interval=2s
          - --retries=3