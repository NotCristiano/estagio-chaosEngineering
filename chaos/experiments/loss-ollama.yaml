  - type: probe
    name: "peak_stress_container_ollama_ram_usage_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "container_memory_working_set_bytes{container=\"ollama\"}"

  - type: probe
    name: "peak_stress_container_ollama_page_faults_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(container_memory_page_faults_total{container=\"ollama\"}[${experiment_duration_window}])[${experiment_duration_resolution_window}])"

  - type: probe
    name: "peak_stress_container_ollama_memory_allocation_failures_total"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(container_memory_failures_total{container=\"ollama\", scope=\"container\", type=\"pgmajfault\"}[${experiment_duration_window}])"

  - type: probe
