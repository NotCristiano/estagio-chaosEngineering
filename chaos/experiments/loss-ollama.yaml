  - type: probe
    name: "pre_fault_hw_disk_io_in_progress_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_disk_io_now"

  - type: probe
    name: "pre_fault_hw_disk_read_throughput_rate_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_disk_read_bytes_total[${baseline_window}])[${baseline_window}])"

  - type: probe
    name: "pre_fault_hw_disk_written_throughput_rate_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_disk_written_bytes_total[${baseline_window}])[${baseline_window}])"

  - type: probe
    name: "pre_fault_hw_network_active_conntrack_entries_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_nf_conntrack_entries"

  - type: probe
    name: "pre_fault_hw_network_receive_drop_rate_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_network_receive_drop_total{device=\"enp2s0\"}[${baseline_window}])[${baseline_window}])"

  - type: probe
    name: "pre_fault_hw_network_transmit_errs_rate_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_network_transmit_errs_total{device=\"enp2s0\"}[${baseline_window}])[${baseline_window}])"


  # INJECT DISRUPTION
  # Apply network loss policy to introduce 30% packet loss
  - type: action
    name: "inject_packet_loss"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "apply"
        - "-f"
        - "experiments/chaos-mesh/network-loss.yaml"
    pauses:
      after: "${experiment_duration}"


  # PEAK DISRUPTION SCRAPE
  - type: probe
    name: "peak_stress_arc_poker_accuracy_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "poker_quality_accuracy{container=\"poker\"}"

  - type: probe
    name: "peak_stress_arc_correct_answers_rate"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(poker_quality_correct_total{container=\"poker\"}[${experiment_duration_window}])"

  - type: probe
    name: "peak_stress_arc_wrong_answers_rate"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(poker_quality_wrong_total{container=\"poker\"}[${experiment_duration_window}])"

  - type: probe
    name: "peak_stress_arc_timedout_answers_rate"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(poker_quality_timeout_total{container=\"poker\"}[${experiment_duration_window}])"

  - type: probe
    name: "peak_stress_arc_request_latency_p95_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, histogram_quantile(0.95, sum(rate(poker_ask_duration_seconds_bucket{container=\"poker\"}[${experiment_duration_window}])) by (le))[${experiment_duration_resolution_window}])"

  - type: probe
    name: "peak_stress_arc_request_latency_p50_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, histogram_quantile(0.50, sum(rate(poker_ask_duration_seconds_bucket{container=\"poker\"}[${experiment_duration_window}])) by (le))[${experiment_duration_resolution_window}])"

  # CONTAINER DASHBOARD METRICS
  - type: probe
    name: "peak_stress_container_ollama_cpu_consumed_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(container_cpu_usage_seconds_total{container=\"ollama\"}[${experiment_duration_window}])[${experiment_duration_resolution_window}])"

  - type: probe
