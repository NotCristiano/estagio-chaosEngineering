version: 1.0.0
title: "Poker survives packet loss of 30%?"
description: "Injects packet loss of 30%. Retry should absorb the loss."

configuration:
  prometheus_base_url: "http://localhost:30900"

steady-state-hypothesis:
  title: "Service is UP (1)"
  probes:
    - type: probe
      name: "check_prometheus_poker_up"
      tolerance:
        type: jsonpath
        path: "$.data.result[0].value[1]"
        expect: "1"
      provider:
        type: python
        module: chaosprometheus.probes
        func: query
        arguments:
          query: "poker_service_up{container=\"poker\"}"

method:
  - type: action
    name: "inject_packet_loss"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "apply"
        - "-f"
        - "experiments/chaos-mesh/network-loss.yaml"
    pauses:
      after: 35

  - type: probe
    name: "check_kubectl_killed_ollama"
    tolerance:
      type: jsonpath
      path: "$.data.result[0].value[1]"
      expect: "0" # Restarts expected in the last 2 min
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "changes(kube_pod_container_status_restarts_total{container=\"ollama\"}[2m])"

  - type: probe
    name: "check_poker_survives_loss"
    tolerance:
      type: jsonpath
      path: "$.data.result[0].value[1]"
      expect: "1"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "poker_service_up{container=\"poker\"}"
    pauses:
      after: 10

  - type: action
    name: "remove_packet_loss"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "delete"
        - "-f"
        - "experiments/chaos-mesh/network-loss.yaml"