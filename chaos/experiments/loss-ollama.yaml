rollbacks:
  - type: action
    name: "ensure_packet_loss_is_removed"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "delete"
        - "-f"
        - "experiments/chaos-mesh/network-loss.yaml"
        - "--ignore-not-found=true"

  - type: action
    name: "restore_canonical_poker_state"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "patch"
        - "deployment"
        - "chaos-poker"
        - "-n"
        - "chaos-production"
        - "--type=json"
        - "-p=[{\"op\": \"replace\", \"path\": \"/spec/template/spec/containers/0/args\", \"value\": [\"--target=http://ollama:11434\", \"--model=qwen2.5:3b\", \"--count=0\", \"--interval=1s\", \"--timeout=3m\", \"--retries=1\", \"--metric-addr=:9090\", \"--wait-timeout=5m\", \"--workers=1\", \"--quality-interval=10s\", \"--probe-num-predict=2\", \"--probe-num-ctx=2048\", \"--ask-num-predict=10\", \"--ask-timeout-fraction=0.9\"]}]"
