version: 1.0.0
title: "Poker Survives Ollama Network Packet Loss"
description: "Injects 30% packet loss into the network path to Ollama using Chaos Mesh, observing how retries absorb the loss and what happens to request latency and error rates."

# CONFIGURATION
configuration:
  prometheus_base_url: "http://localhost:30900"

  # Pre-fault soak timing
  # Seconds to let the system stabilize under canonical settings before scraping control baseline
  pre_fault_soak_duration: 300
  # Prometheus time-window resolution for normal pre-fault evaluation
  baseline_window: "5m:10s"

  # Disruption / peak stress timing
  # Seconds to keep the CPU stress active
  experiment_duration: 1800
  # Prometheus time-window matching the injection length for range queries
  experiment_duration_window: "30m"
  # Subquery time window with resolution mapping for quantile-over-time aggregates
  experiment_duration_resolution_window: "30m:10s"

  # Recovery soak timing
  # Seconds to let the system cool down after clearing the CPU hog
  recovery_soak_duration: 300
  # Prometheus time-window matching the cooldown length for recovery evaluation
  recovery_window: "5m"
  # Subquery time window with resolution mapping for recovery
  recovery_resolution_window: "5m:10s"

# Ensure the system is healthy before starting
steady-state-hypothesis:
  title: "System is Operational"
  probes:
    - type: probe
      name: "check_prometheus_poker_up"
      tolerance:
        type: jsonpath
        path: "$.data.result[0].value[1]"
        expect: "1"
      provider:
        type: python
        module: chaosprometheus.probes
        func: query
        arguments:
          query: "poker_service_up{container=\"poker\"}"

method:
  # SETUP & CANONICAL STATE
  - type: action
    name: "set_canonical_poker_state"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "patch"
        - "deployment"
        - "chaos-poker"
        - "-n"
        - "chaos-production"
        - "--type=json"
        - "-p=[{\"op\": \"replace\", \"path\": \"/spec/template/spec/containers/0/args\", \"value\": [\"--target=http://ollama:11434\", \"--model=qwen2.5:3b\", \"--count=0\", \"--interval=1s\", \"--timeout=2m\", \"--retries=0\", \"--metric-addr=:9090\", \"--wait-timeout=5m\", \"--workers=1\", \"--quality-interval=10s\", \"--probe-num-predict=2\", \"--probe-num-ctx=2048\", \"--ask-num-predict=10\", \"--ask-timeout-fraction=0.9\"]}]"
    pauses:
      after: "${pre_fault_soak_duration}"

  # PRE-FAULT CONTROL SCRAPE

  # ARC DASHBOARD METRICS
  - type: probe
    name: "pre_fault_arc_poker_accuracy_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "poker_quality_accuracy{container=\"poker\"}"

  - type: probe
    name: "pre_fault_arc_correct_answers_rate"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(poker_quality_correct_total{container=\"poker\"}[${baseline_window}])"

  - type: probe
    name: "pre_fault_arc_wrong_answers_rate"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(poker_quality_wrong_total{container=\"poker\"}[${baseline_window}])"

  - type: probe
    name: "pre_fault_arc_timedout_answers_rate"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(poker_quality_timeout_total{container=\"poker\"}[${baseline_window}])"

  - type: probe
    name: "pre_fault_arc_request_latency_p95_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, histogram_quantile(0.95, sum(rate(poker_ask_duration_seconds_bucket{container=\"poker\"}[${baseline_window}])) by (le))[${baseline_window}])"

  - type: probe
    name: "pre_fault_arc_request_latency_p50_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, histogram_quantile(0.50, sum(rate(poker_ask_duration_seconds_bucket{container=\"poker\"}[${baseline_window}])) by (le))[${baseline_window}])"

  # CONTAINER DASHBOARD METRICS
  - type: probe
    name: "pre_fault_container_ollama_cpu_consumed_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(container_cpu_usage_seconds_total{container=\"ollama\"}[${baseline_window}])[${baseline_window}])"

  - type: probe
    name: "pre_fault_container_ollama_throttled_seconds_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(container_cpu_cfs_throttled_seconds_total{container=\"ollama\"}[${baseline_window}])[${baseline_window}])"

  - type: probe
    name: "pre_fault_container_ollama_ram_usage_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "container_memory_working_set_bytes{container=\"ollama\"}"

  - type: probe
    name: "pre_fault_container_ollama_page_faults_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(container_memory_page_faults_total{container=\"ollama\"}[${baseline_window}])[${baseline_window}])"

  - type: probe
    name: "pre_fault_container_ollama_memory_allocation_failures_total"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(container_memory_failures_total{container=\"ollama\", scope=\"container\", type=\"pgmajfault\"}[${baseline_window}])"

  - type: probe
    name: "pre_fault_container_ollama_fs_reads_bytes_rate_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(container_fs_reads_bytes_total{container=\"ollama\"}[${baseline_window}])[${baseline_window}])"

  # INTERNALS DASHBOARD METRICS
  - type: probe
    name: "pre_fault_app_action_duration_ratio_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, (sum by (result) (rate(poker_probe_duration_seconds_sum[${baseline_window}])) / sum by (result) (rate(poker_probe_duration_seconds_count[${baseline_window}])))[${baseline_window}])"

  - type: probe
    name: "pre_fault_app_num_retry_pokes_total"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(poker_retry_total{container=\"poker\"}[${baseline_window}])"

  - type: probe
    name: "pre_fault_app_go_allocated_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "go_memstats_alloc_bytes{container=\"poker\"}"

  - type: probe
    name: "pre_fault_app_go_active_goroutines_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "go_goroutines{container=\"poker\"}"

  - type: probe
    name: "pre_fault_app_go_max_gc_pause_duration_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "go_gc_duration_seconds{container=\"poker\", quantile=\"1.0\"}"

  # KUBERNETES DASHBOARD METRICS
  - type: probe
    name: "pre_fault_k8s_ollama_requested_memory_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "kube_pod_container_resource_requests{container=\"ollama\", resource=\"memory\"}"

  - type: probe
    name: "pre_fault_k8s_ollama_memory_limit_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "kube_pod_container_resource_limits{container=\"ollama\", resource=\"memory\"}"

  - type: probe
    name: "pre_fault_k8s_ollama_pod_running_phase_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "kube_pod_status_phase{namespace=\"chaos-production\", pod=~\"ollama.*\", phase=\"Running\"}"

  - type: probe
    name: "pre_fault_k8s_ollama_killed_deployments_total"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(kube_deployment_status_replicas_ready{deployment=\"ollama\"}[${baseline_window}])"

  # HARDWARE DASHBOARD METRICS
  - type: probe
    name: "pre_fault_hw_cpu_iowait_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_cpu_seconds_total{mode=\"iowait\"}[${baseline_window}])[${baseline_window}])"

  - type: probe
    name: "pre_fault_hw_cpu_temperatures_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_hwmon_temp_celsius"

  - type: probe
    name: "pre_fault_hw_cpu_context_switches_rate_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_context_switches_total[${baseline_window}])[${baseline_window}])"

  - type: probe
    name: "pre_fault_hw_ram_available_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_memory_MemAvailable_bytes"

  - type: probe
    name: "pre_fault_hw_kernel_buffers_bytes_instant"
    provider:
