      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_context_switches_total[${experiment_duration_window}])[${experiment_duration_resolution_window}])"

  - type: probe
    name: "peak_stress_hw_ram_available_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_memory_MemAvailable_bytes"

  - type: probe
    name: "peak_stress_hw_kernel_buffers_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_memory_Buffers_bytes"

  - type: probe
    name: "peak_stress_hw_swap_cached_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_memory_SwapCached_bytes"

  - type: probe
    name: "peak_stress_hw_swap_free_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_memory_SwapFree_bytes"

  - type: probe
    name: "peak_stress_hw_disk_read_time_seconds_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_disk_read_time_seconds_total"

  - type: probe
    name: "peak_stress_hw_disk_write_time_seconds_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_disk_write_time_seconds_total"

  - type: probe
    name: "peak_stress_hw_disk_io_in_progress_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_disk_io_now"

  - type: probe
    name: "peak_stress_hw_disk_read_throughput_rate_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_disk_read_bytes_total[${experiment_duration_window}])[${experiment_duration_resolution_window}])"

  - type: probe
    name: "peak_stress_hw_disk_written_throughput_rate_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_disk_written_bytes_total[${experiment_duration_window}])[${experiment_duration_resolution_window}])"

  - type: probe
    name: "peak_stress_hw_network_active_conntrack_entries_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "node_nf_conntrack_entries"

  - type: probe
    name: "peak_stress_hw_network_receive_drop_rate_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_network_receive_drop_total{device=\"enp2s0\"}[${experiment_duration_window}])[${experiment_duration_resolution_window}])"

  - type: probe
    name: "peak_stress_hw_network_transmit_errs_rate_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "quantile_over_time(0.5, rate(node_network_transmit_errs_total{device=\"enp2s0\"}[${experiment_duration_window}])[${experiment_duration_resolution_window}])"


  # CLEANUP & RECOVERY SOAK
  # Remove the packet loss policy
  - type: action
    name: "remove_packet_loss"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "delete"
        - "-f"
        - "experiments/chaos-mesh/network-loss.yaml"
    pauses:
      after: "${recovery_soak_duration}"


  # RECOVERED STATE SCRAPE

  # ARC DASHBOARD METRICS
  - type: probe
    name: "recovered_arc_poker_accuracy_instant"
