  - type: probe
    name: "peak_stress_app_num_retry_pokes_total"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(poker_retry_total{container=\"poker\"}[${experiment_duration_window}])"

  - type: probe
    name: "peak_stress_app_go_allocated_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "go_memstats_alloc_bytes{container=\"poker\"}"

  - type: probe
    name: "peak_stress_app_go_active_goroutines_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "go_goroutines{container=\"poker\"}"

  - type: probe
    name: "peak_stress_app_go_max_gc_pause_duration_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "go_gc_duration_seconds{container=\"poker\", quantile=\"1.0\"}"

  # KUBERNETES DASHBOARD METRICS
  - type: probe
    name: "peak_stress_k8s_ollama_requested_memory_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "kube_pod_container_resource_requests{container=\"ollama\", resource=\"memory\"}"

  - type: probe
    name: "peak_stress_k8s_ollama_memory_limit_bytes_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "kube_pod_container_resource_limits{container=\"ollama\", resource=\"memory\"}"

  - type: probe
    name: "peak_stress_k8s_ollama_pod_running_phase_instant"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "kube_pod_status_phase{namespace=\"chaos-production\", pod=~\"ollama.*\", phase=\"Running\"}"

  - type: probe
    name: "peak_stress_k8s_ollama_killed_deployments_total"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "increase(kube_deployment_status_replicas_ready{deployment=\"ollama\"}[${experiment_duration_window}])"

  # HARDWARE DASHBOARD METRICS
  - type: probe
    name: "peak_stress_hw_cpu_iowait_median"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
