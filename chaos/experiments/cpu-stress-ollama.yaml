version: 1.0.0
title: "Poker survives ollama cpu stress?"
description: "Injects a process that uses 4 cores and 100% of the CPU."

configuration:
  prometheus_base_url: "http://localhost:30900"

steady-state-hypothesis:
  title: "Service is UP (1)"
  probes:
    - type: probe
      name: "check_prometheus_poker_up"
      tolerance:
        type: jsonpath
        path: "$.data.result[0].value[1]"
        expect: "1"
      provider:
        type: python
        module: chaosprometheus.probes
        func: query
        arguments:
          query: "poker_service_up{container=\"poker\"}"

method:
  - type: action
    name: "inject_cpu_stress"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "apply"
        - "-f"
        - "experiments/chaos-mesh/cpu-hog.yaml"
    pauses:
      after: 45

  - type: probe
    name: "check_poker_survided_cpu_stress"
    tolerance:
      type: jsonpath
      path: "$.data.result[0].value[1]"
      expect: "1"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "poker_service_up{container=\"poker\"}"
    pauses:
      after: 10

  - type: action
    name: "remove_cpu_stress"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "delete"
        - "-f"
        - "experiments/chaos-mesh/cpu-hog.yaml"