version: 1.0.0
title: "Poker survives latency in Ollama?"
description: "Injects latency in the Ollama service and checks if the poker service remains UP."

configuration:
  prometheus_base_url: "http://localhost:30900"

steady-state-hypothesis:
  title: "Service is UP (1)"
  probes:
    - type: probe
      name: "check_prometheus_poker_up"
      tolerance:
        type: jsonpath
        path: "$.data.result[0].value[1]"
        expect: "1"
      provider:
        type: python
        module: chaosprometheus.probes
        func: query
        arguments:
          query: "poker_service_up{container=\"poker\"}"

method:
  - type: action
    name: "inject_latency_chaos_mesh"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "apply"
        - "-f"
        - "experiments/chaos-mesh/network-delay.yaml"
    pauses:
      after: 20

  - type: probe
    name: "check_poker_survived_latency"
    tolerance:
      type: jsonpath
      path: "$.data.result[0].value[1]"
      expect: "1"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "poker_service_up{container=\"poker\"}"
    pauses:
      after: 30

  - type: action
    name: "remove_latency_chaos_mesh"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "delete"
        - "-f"
        - "experiments/chaos-mesh/network-delay.yaml"