version: 1.0.0
title: "Poker survives OOM?"
description: "Injects memory leak. K8s should kill Ollama"

configuration:
  prometheus_base_url: "http://localhost:30900"

steady-state-hypothesis:
  title: "Service is UP (1)"
  probes:
    - type: probe
      name: "check_prometheus_poker_up"
      tolerance:
        type: jsonpath
        path: "$.data.result[0].value[1]"
        expect: "1"
      provider:
        type: python
        module: chaosprometheus.probes
        func: query
        arguments:
          query: "poker_service_up{container=\"poker\"}"

method:
  - type: action
    name: "inject_memory_leak"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "apply"
        - "-f"
        - "experiments/chaos-mesh/memory-leak.yaml"
    pauses:
      after: 30

  - type: probe
    name: "check_oom_killed"
    tolerance:
      type: jsonpath
      path: "$.data.result[0].value[1]"
      expect: "1"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "changes(kube_pod_container_status_restarts_total{container=\"ollama\"}[2m])"

  - type: probe
    name: "check_poker_alive"
    tolerance:
      type: jsonpath
      path: "$.data.result[0].value[1]"
      expect: "1"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "poker_service_up{container=\"poker\"}"
    pauses:
      after: 10

  - type: action
    name: "cleanup"
    provider:
      type: process
      path: "kubectl"
      arguments:
        - "delete"
        - "-f"
        - "experiments/chaos-mesh/memory-leak.yaml"
