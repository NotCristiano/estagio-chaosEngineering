version: 1.0.0
title: "Poker survives Ollama Pod Eviction (Disk Fill)?"
description: "Fills the disk of a Ollama pod causing it to be evicted."

configuration:
  prometheus_base_url: "http://localhost:30900"

steady-state-hypothesis:
  title: "Service is UP (1)"
  probes:
    - type: probe
      name: "check_prometheus_poker_up"
      tolerance:
        type: jsonpath
        path: "$.data.result[0].value[1]"
        expect: "1"
      provider:
        type: python
        module: chaosprometheus.probes
        func: query
        arguments:
          query: "poker_service_up{container=\"poker\"}"

method:
  - type: action
    name: "fill_disk"
    provider:
      type: process
      path: "sh"
      arguments:
        - "-c"
        # Executes a dd (destroyer of disks) command to fill pod's disk
        - "kubectl exec -n chaos-production deploy/ollama -- dd if=/dev/zero of=/tmp/diskfill bs=1M count=2500"
    pauses:
      after: 40

  - type: probe
    name: "check_poker_survives_eviction"
    tolerance:
      type: jsonpath
      path: "$.data.result[0].value[1]"
      expect: "1"
    provider:
      type: python
      module: chaosprometheus.probes
      func: query
      arguments:
        query: "poker_service_up{container=\"poker\"}"
    pauses:
      after: 10